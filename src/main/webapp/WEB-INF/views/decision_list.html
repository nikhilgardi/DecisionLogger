<!DOCTYPE html>
<html xmlns:th="http:www.thymleaf.org"
	th:replace="layout::layout(~{::body})">
<body>
	<div th:fragment="content">
		<!-- Success -->
		<div class="alert alert-success" th:if="${success}"
			th:text="${success}"></div>
		<!-- Error -->
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

		<!-- Card -->
		<div class="card">
		<!-- Header -->
			<div class="card-header container-fluid">
				<div class="row">
					<div class="col-md-10">
						<h3 class="w-75 p-3">Decision List</h3>
					</div>
					<div class="col-md-2 float-right">
						<a th:href="@{/decision/user-decision-form}" class="btn btn-primary">Create
							Decision</a>
					</div>
				</div>
			</div>
			
		<!-- Body -->
		<div class="card-body">
			<table class="table" id="decisionTable">
				<thead>
					<tr>
						<th>#</th>
						<th>Title</th>
						<th>Context</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="decision,decStat:${decisions}">
						<td th:text="${decStat.count}"></td>
						<td th:text="${decision.title}"></td>
						<td th:text="${decision.context}"></td>
					</tr>
				</tbody>
			</table>
		</div>

		</div>

	</div>
	
	<!-- DATATABLE SCRIPT -->
	<script>
		$(function() {

			$('#decisionTable').DataTable({
				pageLength : 5,
				language : {
					emptyTable : "No record found"
				}
			});

		});
	</script>
</body>
</html>
