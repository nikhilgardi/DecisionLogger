<!DOCTYPE html>
<html xmlns:th="http://www.thymleaf.org"
	th:replace="layout::layout(~{::body})">
<body>
	<div th:fragment="content">

		<!-- SUCCESS -->
		<div class="alert alert-success" th:if="${success}"
			th:text="${success}"></div>

		<!-- ERROR -->
		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

		<div class="card">

			<!-- HEADER -->
			<div class="card-header">
				<h3 th:text="${user.id} != null ? 'Edit User' : 'Create User'"></h3>
			</div>

			<div class="card-body">

				<form
					th:action="${user.id} != null ? @{/admin/update-user} : @{/admin/create-user}"
					method="post" th:object="${user}">

					<!-- ID (only for edit) -->
					<input type="hidden" th:if="${user.id}" th:field="*{id}" />

					<!-- NAME -->
					<div class="mb-3">
						<label>Name</label><!--  <input type="text" th:field="*{fullName}"
							class="form-control" th:readonly="${user.id != null}"> -->
							 <input type="text" th:field="*{fullName}"
							class="form-control">
					</div>

					<!-- EMAIL -->
					<div class="mb-3">
						<label>Email</label> <input type="email" th:field="*{email}"
							class="form-control" th:readonly="${user.id != null}">
					</div>

					<!-- PASSWORD (only for create) -->
					<div class="mb-3">

						<label>Password</label>

						<div class="input-group">

							<input type="password" id="password" th:field="*{password}"
								class="form-control" placeholder="Only required for create"
								th:readonly="${user.id != null}">

							<button class="btn btn-outline-secondary" type="button"
								id="togglePassword" th:if="${user.id == null}">
								<i class="fas fa-eye"></i>
							</button>

						</div>

						<div th:if="${user.id == null}">
							<div class="progress mt-2" style="height: 5px;">
								<div id="passwordStrengthBar" class="progress-bar"></div>
							</div>

							<small class="text-muted"> Password must be 8–12 chars
								with uppercase, number, special char. </small>
						</div>

					</div>

					<!-- ROLE (ONLY EDITABLE IN EDIT) -->
					<div class="mb-3">
						<label>Role</label> <select th:field="*{role}"
							class="form-control">
							<option value="ADMIN">ADMIN</option>
							<option value="USER">USER</option>
						</select>
					</div>

					<!-- BUTTON -->
					<button class="btn btn-success"
						th:text="${user.id} != null ? 'Update' : 'Create'"></button>

					<a th:href="@{/admin/get-user}" class="btn btn-secondary">Cancel</a>

				</form>

			</div>
		</div>

	</div>

	<script th:src="@{/static/js/passwordtoggle.js}"></script>

</body>
</html>


</div>

<!-- ================= JS ================= -->

<script th:src="@{/static/js/passwordtoggle.js}"></script>

</body>
</html>

</div>



</body>
</html>
