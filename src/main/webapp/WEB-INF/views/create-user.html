<!DOCTYPE html>
<html xmlns:th="http://www.thymleaf.org"
	th:replace="layout::layout(~{::body})">
<body>
	<div th:fragment="content">

		<!-- ================= SUCCESS MESSAGE ================= -->
		<div class="alert alert-success alert-dismissible fade show"
			th:if="${success}" role="alert">
			<span th:text="${success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<!-- ================= ERROR MESSAGE ================= -->
		<div class="alert alert-danger alert-dismissible fade show"
			th:if="${error}" role="alert">
			<span th:text="${error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<!-- ================= CREATE USER CARD ================= -->
		<div class="card">
			<div class="card-header">
				<h3>Create User</h3>
			</div>
			<div class="card-body">
				<form th:action="@{/admin/create-user}" method="post"
					th:object="${user}">
					<!-- NAME -->
					<div class="mb-3">
						<label>Name</label> <input type="text" th:field="*{fullName}"
							class="form-control" required>
					</div>
					<!-- EMAIL -->
					<div class="mb-3">
						<label>Email</label> <input type="email" th:field="*{email}"
							class="form-control" required>
					</div>
					<!-- PASSWORD -->
					<div class="mb-3">
						<label>Password</label>
						<div class="input-group">
							<input type="password" id="password" th:field="*{password}"
								class="form-control"
								placeholder="Min 8 chars, include A-Z, 0-9, special char"
								required>
							<!-- TOGGLE PASSWORD -->
							<button class="btn btn-outline-secondary" type="button"
								id="togglePassword">
								<i class="fas fa-eye"></i>
							</button>
						</div>
						<!-- PASSWORD STRENGTH BAR -->
						<div class="progress mt-2" style="height: 5px;">
							<div id="passwordStrengthBar" class="progress-bar"
								style="width: 0%"></div>
						</div>
						<small class="text-muted"> Password must be at least 8
							characters and include uppercase, number, and special character.
						</small>
					</div>
					<!-- ROLE -->
					<div class="mb-3">
						<label>Role</label> <select th:field="*{role}"
							class="form-control">
							<option value="ADMIN">ADMIN</option>
							<option value="USER">USER</option>
						</select>
					</div>
					<!-- BUTTONS -->
					<button class="btn btn-success">Create</button>
					<a th:href="@{/admin/dashboard}" class="btn btn-secondary">Cancel</a>
				</form>
			</div>
		</div>

	</div>

<script th:src="@{/static/js/passwordtoggle.js}"></script>

</body>
</html>
