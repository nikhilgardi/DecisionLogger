<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>

<meta charset="UTF-8">
<title>Decision Logger</title>

<!-- ================= CSS ================= -->

<!-- Bootstrap -->
<link rel="stylesheet" th:href="@{/static/css/bootstrap.min.css}">

<!-- FontAwesome -->
<link rel="stylesheet" th:href="@{/static/css/all.min.css}">

<!-- AdminLTE -->
<link rel="stylesheet" th:href="@{/static/css/adminlte.min.css}">

<!-- DataTables -->
<link rel="stylesheet"
	th:href="@{/static/css/dataTables.bootstrap4.min.css}">

<link rel="stylesheet" th:href="@{/static/css/style.css}">

</head>


<body class="hold-transition sidebar-mini">

	<div class="wrapper">

		<!-- ================= NAVBAR ================= -->

		<nav
			class="main-header navbar navbar-expand navbar-white navbar-light">

			<ul class="navbar-nav">

				<li class="nav-item"><a class="nav-link" data-widget="pushmenu"
					href="#" role="button"> <i class="fas fa-bars"></i>

				</a></li>

			</ul>

		</nav>


		<!-- ================= SIDEBAR ================= -->

		<aside class="main-sidebar sidebar-dark-primary elevation-4">

			<a class="brand-link text-center"> <span
				class="brand-text font-weight-light"> Decision Logger </span>

			</a>

			<div class="sidebar">

				<div th:replace="fragments/sidebar :: sidebar"></div>

			</div>

		</aside>


		<!-- ================= PAGE CONTENT ================= -->

		<div class="content-wrapper">

			<section class="content p-4">

				<div th:replace="${content}"></div>

			</section>

		</div>


	</div>


	<!-- ================= JS ================= -->

	<!-- jQuery (must load FIRST) -->
	<script th:src="@{/static/js/jquery.min.js}"></script>

	<!-- Bootstrap -->
	<script th:src="@{/static/js/bootstrap.bundle.min.js}"></script>

	<!-- AdminLTE -->
	<script th:src="@{/static/js/adminlte.min.js}"></script>

	<!-- DataTables -->
	<script th:src="@{/static/js/jquery.dataTables.min.js}"></script>

	<script th:src="@{/static/js/dataTables.bootstrap4.min.js}"></script>

	<script th:src="@{/static/js/passwordtoggle.js}"></script>

</body>

</html>
