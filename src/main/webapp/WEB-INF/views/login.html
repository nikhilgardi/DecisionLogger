<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Login</title>

<meta charset="UTF-8">


<!-- Bootstrap -->
<link rel="stylesheet" th:href="@{/static/css/bootstrap.min.css}">
<!-- FontAwesome -->
<link rel="stylesheet" th:href="@{/static/css/all.min.css}">

<style>
.required-star {
	color: red;
	margin-left: 3px;
}

.password-strength {
	height: 5px;
	margin-top: 5px;
}

.strength-weak {
	background: red;
}

.strength-medium {
	background: orange;
}

.strength-strong {
	background: green;
}
</style>

</head>

<body class="bg-light">

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="col-md-4">

				<div class="card shadow">

					<div class="card-body">

						<h4 class="text-center mb-4">Login</h4>


						<!-- GLOBAL ERROR -->

						<div class="alert alert-danger" th:if="${error}"
							th:text="${error}"></div>


						<form id="loginForm" th:action="@{/auth/login}"
							th:object="${loginForm}" method="post">


							<!-- ================= EMAIL ================= -->

							<div class="mb-3">

								<label> Email <span class="required-star">*</span>
								</label> <input type="email" id="email" class="form-control"
									autocomplete="off" th:field="*{email}"
									placeholder="Enter email" required>

								<div class="text-danger mt-1"
									th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
								</div>

							</div>


							<!-- ================= PASSWORD ================= -->

							<div class="mb-3">

								<label> Password <span class="required-star">*</span>
								</label>

								<div class="input-group">

									<input type="password" id="password" class="form-control"
										th:field="*{password}" placeholder="Enter password" required>

									<button class="btn btn-outline-secondary" type="button"
										id="togglePassword">

										<i class="fas fa-eye"></i>

									</button>

								</div>


								<!-- PASSWORD STRENGTH BAR -->

								<div class="progress password-strength">

									<div id="passwordStrengthBar" class="progress-bar"
										style="width: 0%"></div>

								</div>


								<div class="text-danger mt-1"
									th:if="${#fields.hasErrors('password')}"
									th:errors="*{password}"></div>

							</div>


							<!-- ================= REMEMBER ME ================= -->

							<div class="form-check mb-3">

								<input type="checkbox" class="form-check-input"
									th:field="*{rememberMe}"> <label
									class="form-check-label"> Remember Me </label>

							</div>


							<!-- ================= LOGIN BUTTON ================= -->

							<button id="loginButton" class="btn btn-primary w-100" disabled>

								Login</button>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>



	<script>
		/* ======================================
		 PASSWORD TOGGLE
		 ====================================== */

		document.getElementById("togglePassword").addEventListener("click",
				function() {

					const passwordField = document.getElementById("password");

					const icon = this.querySelector("i");

					if (passwordField.type === "password") {

						passwordField.type = "text";

						icon.classList.remove("fa-eye");
						icon.classList.add("fa-eye-slash");

					} else {

						passwordField.type = "password";

						icon.classList.remove("fa-eye-slash");
						icon.classList.add("fa-eye");

					}

				});

		/* ======================================
		 PASSWORD STRENGTH
		 ====================================== */

		document.getElementById("password").addEventListener("input",
				function() {

					const value = this.value;

					const bar = document.getElementById("passwordStrengthBar");

					let strength = 0;

					if (value.length >= 6)
						strength++;

					if (/[A-Z]/.test(value))
						strength++;

					if (/[0-9]/.test(value))
						strength++;

					if (/[@$!%*?&]/.test(value))
						strength++;

					let width = strength * 25;

					bar.style.width = width + "%";

					bar.className = "progress-bar";

					if (strength <= 1) {
						bar.classList.add("strength-weak");
					}

					else if (strength == 2 || strength == 3) {
						bar.classList.add("strength-medium");
					}

					else {
						bar.classList.add("strength-strong");
					}

				});

		/* ======================================
		 FORM VALIDATION
		 ENABLE LOGIN BUTTON
		 ====================================== */

		const emailInput = document.getElementById("email");

		const passwordInput = document.getElementById("password");

		const loginButton = document.getElementById("loginButton");

		function validateForm() {

			if (emailInput.value.trim() !== ""
					&& passwordInput.value.trim() !== "") {

				loginButton.disabled = false;

			} else {

				loginButton.disabled = true;

			}

		}

		emailInput.addEventListener("input", validateForm);
		passwordInput.addEventListener("input", validateForm);

		/* ======================================
		 ENTER KEY SUBMIT
		 ====================================== */

		document.getElementById("loginForm").addEventListener("keypress",
				function(e) {

					if (e.key === "Enter") {

						if (!loginButton.disabled) {
							this.submit();
						}

					}

				});
	</script>

</body>

</html>
