<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Login</title>

<meta charset="UTF-8">


<!-- Bootstrap -->
<link rel="stylesheet" th:href="@{/static/css/bootstrap.min.css}">
<!-- FontAwesome -->
<link rel="stylesheet" th:href="@{/static/css/all.min.css}">

<link rel="stylesheet" th:href="@{/static/css/style.css}">


</head>

<body class="bg-light">

	<div class="container mt-5">

		<div class="row justify-content-center">

			<div class="col-md-4">

				<div class="card shadow">

					<div class="card-body">

						<h4 class="text-center mb-4">Login</h4>


						<!-- GLOBAL ERROR -->

						<div class="alert alert-danger" th:if="${error}"
							th:text="${error}"></div>


						<form id="loginForm" th:action="@{/auth/login}"
							th:object="${loginForm}" method="post">


							<!-- ================= EMAIL ================= -->

							<div class="mb-3">

								<label> Email <span class="required-star">*</span>
								</label> <input type="email" id="email" class="form-control"
									autocomplete="off" th:field="*{email}"
									placeholder="Enter email">

								<div class="text-danger mt-1"
									th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
								</div>

							</div>


							<!-- ================= PASSWORD ================= -->

							<div class="mb-3">

								<label> Password <span class="required-star">*</span>
								</label>

								<div class="input-group">

									<input type="password" id="password" class="form-control" maxLength="16"
										th:field="*{password}" placeholder="Enter password">

									<button class="btn btn-outline-secondary" type="button"
										id="togglePassword">

										<i class="fas fa-eye"></i>

									</button>

								</div>


								<!-- PASSWORD STRENGTH BAR -->

								<div class="progress password-strength">

									<div id="passwordStrengthBar" class="progress-bar"
										style="width: 0%"></div>

								</div>


								<div class="text-danger mt-1"
									th:if="${#fields.hasErrors('password')}"
									th:errors="*{password}"></div>

							</div>


							<!-- ================= REMEMBER ME ================= -->

							<div class="form-check mb-3">

								<input type="checkbox" class="form-check-input"
									th:field="*{rememberMe}"> <label
									class="form-check-label"> Remember Me </label>

							</div>


							<!-- ================= LOGIN BUTTON ================= -->

							<button id="loginButton" class="btn btn-primary w-100">Login</button>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>



	
<script th:src="@{/static/js/passwordtoggle.js}"></script>
</body>

</html>
