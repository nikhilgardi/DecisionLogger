<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body">

                    <h4 class="text-center mb-4">Login</h4>

                    <!-- Error Message -->
                    <div class="alert alert-danger"
                         th:if="${error}"
                         th:text="${error}">
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/auth/login}"
                          th:object="${loginForm}"
                          method="post">

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password"
                                   class="form-control"
                                   th:field="*{password}"
                                   required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox"
                                   class="form-check-input"
                                   th:field="*{rememberMe}">
                            <label class="form-check-label">
                                Remember Me
                            </label>
                        </div>

                        <button class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
